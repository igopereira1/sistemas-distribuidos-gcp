name: Deploy Backend API (Google Cloud)

on:
  push:
    branches: ["main"]
    paths:
      - 'src/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'package*.json'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Autenticação no Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configurar Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Instalar Dependências e Executar Migração do Banco (db:init)
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          SECRET_NAME: ${{ secrets.SECRET_NAME || 'app-distribuida-gcp-db-credentials' }}
        run: |
          echo "Buscando credenciais do banco no Secret Manager..."
          SECRET_JSON=$(gcloud secrets versions access latest --secret="$SECRET_NAME" --project="$PROJECT_ID")
          export DB_HOST=$(echo "$SECRET_JSON" | jq -r .host)
          export DB_USER=$(echo "$SECRET_JSON" | jq -r .username)
          export DB_PASSWORD=$(echo "$SECRET_JSON" | jq -r .password)
          export DB_NAME=$(echo "$SECRET_JSON" | jq -r .database)

          npm ci
          npm run db:init

      - name: Autenticar Docker no Artifact Registry
        run: |
          REGION="${{ secrets.GCP_REGION || 'us-central1' }}"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - name: Build e Push da Imagem Docker (SemVer)
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ secrets.GCP_REGION || 'us-central1' }}
          REPO_NAME: ${{ secrets.ARTIFACT_REPO_NAME || 'backend-repo' }}
          IMAGE_TAG: v1.0.${{ github.run_number }}
        run: |
          IMAGE_URI="$REGION-docker.pkg.dev/$PROJECT_ID/$REPO_NAME/backend-api"

          echo "Construindo imagem: $IMAGE_URI:$IMAGE_TAG..."
          docker build -t "$IMAGE_URI:$IMAGE_TAG" -t "$IMAGE_URI:latest" .

          echo "Publicando versões no Google Artifact Registry..."
          docker push "$IMAGE_URI:$IMAGE_TAG"
          docker push "$IMAGE_URI:latest"

      - name: Deploy no Managed Instance Group (Rolling Replace sem Downtime)
        env:
          REGION: ${{ secrets.GCP_REGION || 'us-central1' }}
          MIG_NAME: ${{ secrets.MIG_NAME || 'app-distribuida-gcp-mig' }}
        run: |
          echo "Atualizando gradualmente as instâncias do MIG: $MIG_NAME..."
          # O comando 'rolling-action replace' recria as VMs de forma rolante,
          # garantindo que o novo container seja executado do zero sem interromper o serviço.
          gcloud compute instance-groups managed rolling-action replace "$MIG_NAME" \
            --region="$REGION" \
            --max-unavailable=0
