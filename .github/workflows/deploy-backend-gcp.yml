name: Deploy Backend API (Google Cloud)

on:
  push:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Autenticação no Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configurar Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Autenticar Docker no Artifact Registry
        run: |
          REGION="${{ secrets.GCP_REGION || 'us-central1' }}"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - name: Build e Push da Imagem Docker (SemVer)
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ secrets.GCP_REGION || 'us-central1' }}
          REPO_NAME: ${{ secrets.ARTIFACT_REPO_NAME || 'backend-repo' }}
          IMAGE_TAG: v1.0.${{ github.run_number }}
        run: |
          IMAGE_URI="$REGION-docker.pkg.dev/$PROJECT_ID/$REPO_NAME/backend-api"

          echo "Construindo imagem: $IMAGE_URI:$IMAGE_TAG..."
          docker build -t "$IMAGE_URI:$IMAGE_TAG" -t "$IMAGE_URI:latest" .

          echo "Publicando versões no Google Artifact Registry..."
          docker push "$IMAGE_URI:$IMAGE_TAG"
          docker push "$IMAGE_URI:latest"

      - name: Deploy no Managed Instance Group (Rolling Restart sem Downtime)
        env:
          REGION: ${{ secrets.GCP_REGION || 'us-central1' }}
          MIG_NAME: ${{ secrets.MIG_NAME || 'app-distribuida-gcp-mig' }}
        run: |
          echo "Reiniciando gradualmente as instancias do MIG: $MIG_NAME..."
          # O comando 'restart' reinicia as VMs uma a uma de forma rolante,
          # fazendo com que baixem a nova imagem com a tag :latest sem interromper o serviço.
          gcloud compute instance-groups managed restart "$MIG_NAME" \
            --region="$REGION"
